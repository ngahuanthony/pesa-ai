# Pesa AI — nginx configuration
# Place at: /etc/nginx/sites-available/pesaai.africa
# Enable: ln -s /etc/nginx/sites-available/pesaai.africa /etc/nginx/sites-enabled/
#
# After certbot runs it will add the SSL block automatically.

server {
    listen 80;
    server_name pesaai.africa www.pesaai.africa;

    # Certbot will add an HTTPS redirect here after: certbot --nginx -d pesaai.africa -d www.pesaai.africa

    # ── API + webhook — proxy to Node.js ──────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large video uploads (up to 50 MB)
        client_max_body_size 50M;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    location /webhook {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static React frontend ──────────────────────────────────────────────
    root /opt/pesa-ai/artifacts/pesa-ai/dist/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
